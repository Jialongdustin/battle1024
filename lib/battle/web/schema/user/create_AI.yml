api: "/user/create_AI"
request:
  type: object
  properties:
    ai_name:
      type: string
    git_url:
      type: string
    tag:
      type: string
    moment_token:
      type: string
  required: [ai_name, git_url, tag, moment_token]

response:
  type: object
  properties:
    code:
      type: number
    message:
      type: string
    state:
      type: string