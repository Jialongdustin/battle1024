api: "/play/init"
request:
  type: object
  properties:
    moment_token:
      type: string

response:
  type: object
  properties:
    code:
      type: string
    winner:
      type: string
    white_king:
      type: string
    black_king:
      type: string
    opponent_step:
      type: array
      items:
        type: array
        items:
          type: integer
    captured:
      type: array
      items:
        type: array
        items:
          type: integer
    board:
      type: array
      items:
        type: array
        items:
          type: integer
    available_step:
      type: array
      items:
        type: array
        items:
          type: integer
