api: "/contest/test_AI"
request:
  type: object
  properties:
    git_url:
      type: string
    tag:
      type: string
    ai_name:
      type: string
  required: [git_url, tag]

response:
  type: object
  properties:
    code:
      type: number
    state:
      type: string
    message:
      type: string